<!doctype html><html><head><meta charset="utf-8"><title>POLYFALL Road to Launch (wide)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--ground:#15171B;--panel:#1F2228;--panel-2:#2A2E35;--line:#3A3F48;--ink:#E6EEF2;--muted:#A9B2BB;--teal:#1FB5AC;--glow:#3EF2E6;--teal-dark:#147A78;--orange:#FF8A1F;--gold:#F2A51A;
--fd:"Chakra Petch",system-ui,sans-serif;--fb:"Barlow",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ground);color:var(--ink);font:500 20px/1.35 var(--fb)}
#facets{position:fixed;inset:0;width:1920px;height:1080px;z-index:0}
.page{position:relative;z-index:1;display:grid;grid-template-columns:640px 1fr;gap:48px;padding:56px 64px;height:1080px;box-sizing:border-box}
.left{display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:14px;font:700 26px var(--fd);letter-spacing:.08em}.brand img{width:52px;height:52px;border-radius:12px}
#title{width:100%;height:auto;display:block}
.lede{color:var(--muted);font-size:22px;margin:0}
.meter{background:rgba(31,34,40,.92);border:1px solid var(--line);padding:26px 28px;display:grid;gap:16px}
.eyebrow{font:600 16px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{font:700 124px/.9 var(--fm)}.big small{font-size:.38em;color:var(--muted);margin-left:6px}
.now{font-size:22px;color:var(--muted)}.now b{color:var(--gold);font-family:var(--fd)}
.shards{display:grid;grid-template-columns:repeat(40,1fr);gap:3px;height:34px}
.shard{background:var(--panel-2);clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)}
.shard.on{background:linear-gradient(180deg,var(--glow),var(--teal) 55%,var(--teal-dark))}.shard.tip{background:linear-gradient(180deg,#fff,var(--gold) 50%,var(--orange))}
.right{display:grid;grid-template-rows:auto auto 1fr;gap:30px;min-width:0}
h2{font:700 28px var(--fd);margin:0 0 14px;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:16px;height:20px;background:var(--orange);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%)}
.phases{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.phase{background:rgba(31,34,40,.92);border:1px solid var(--line);padding:14px;display:grid;gap:8px;align-content:start}
.phase.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.phase .num{font:700 15px var(--fm);color:var(--muted)}.phase h3{font:700 21px var(--fd);margin:0}
.chip{justify-self:start;font:600 14px var(--fd);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px}
.chip.done{background:var(--teal-dark);color:#DFFBF8}.chip.current{background:var(--gold);color:#1b1203}.chip.later{border:1px solid var(--line);color:var(--muted)}
.mini{height:7px;background:var(--panel-2)}.mini i{display:block;height:100%;background:var(--teal)}.phase.current .mini i{background:var(--gold)}
.pct{font:700 17px var(--fm);color:var(--muted)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:16px 36px}
.area-head{display:flex;justify-content:space-between;align-items:baseline}.area-head h3{font:700 23px var(--fd);margin:0}.area-head span{font:700 22px var(--fm);color:var(--glow)}
.bar{height:16px;margin:6px 0 6px;background:var(--panel-2);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(115deg,var(--teal) 0 14px,var(--glow) 14px 18px)}
.area p{margin:0;color:var(--muted);font-size:18px}
.bottom{display:grid;grid-template-columns:1fr;align-content:start}
.next{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 36px}
.next li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:20px}
.next li::before{content:"";width:13px;height:13px;margin-top:6px;border:2px solid var(--gold);transform:rotate(45deg)}
.foot{position:absolute;left:64px;bottom:26px;color:var(--muted);font-size:16px}
</style></head><body>
<canvas id="facets"></canvas>
<div class="page">
 <div class="left">
  <div class="brand"><img src="img/icon128.png" alt=""><span>POLYFALL</span></div>
  <svg id="title" role="img" aria-label="Road to launch"></svg>
  <p class="lede">A low-poly, zero-build battle royale where movement is the build.</p>
  <div class="meter"><div class="eyebrow">Road to Early Access</div><div class="big" id="overall">0<small>%</small></div>
   <div class="shards" id="shards"></div><div class="now">Now in <b id="now"></b></div></div>
 </div>
 <div class="right">
  <section><h2>Phases</h2><div class="phases" id="phases"></div></section>
  <section><h2>Parts of the game</h2><div class="areas" id="areas"></div></section>
  <section class="bottom"><h2>Up next</h2><ul class="next" id="next"></ul></section>
 </div>
 <div class="foot">POLYFALL · solo dev project · Unreal Engine 5</div>
</div>
<script>
(function facets() {
  const c = document.getElementById("facets"), x = c.getContext("2d");
  function draw() {
    const W = c.width = innerWidth, H = c.height = innerHeight, n = Math.max(6, Math.round(W / 140)), m = Math.max(4, Math.round(H / 140));
    let s = 44; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    const P = []; for (let j = 0; j <= m; j++) { P.push([]); for (let i = 0; i <= n; i++) { const e = !i || !j || i === n || j === m;
      P[j].push([i * W / n + (e ? 0 : (r() - .5) * W / n * .7), j * H / m + (e ? 0 : (r() - .5) * H / m * .7)]); } }
    const lo = [21, 23, 27], hi = [42, 46, 53];
    for (let j = 0; j < m; j++) for (let i = 0; i < n; i++) {
      const a = P[j][i], b = P[j][i + 1], cc = P[j + 1][i + 1], d = P[j + 1][i];
      for (const t of (i + j) % 2 ? [[a, b, cc], [a, cc, d]] : [[a, b, d], [b, cc, d]]) {
        const k = Math.min(1, Math.max(0, 1 - ((t[0][0] + t[1][0] + t[2][0]) / 3 / W + (t[0][1] + t[1][1] + t[2][1]) / 3 / H) / 2 + (r() - .5) * .2)) * .55;
        x.fillStyle = `rgb(${lo.map((v, q) => Math.round(v + (hi[q] - v) * k)).join(",")})`;
        x.beginPath(); x.moveTo(...t[0]); x.lineTo(...t[1]); x.lineTo(...t[2]); x.closePath(); x.fill(); x.strokeStyle = x.fillStyle; x.stroke();
      }
    }
  }
  draw(); addEventListener("resize", draw);
})();

// ---- "PF Shard" lettering (the game's own polygon alphabet) ----
const G = {
  R: [[[0,2],[2,0],[7,0],[10,3],[10,6.5],[8,8.5],[10.5,14],[7.3,14],[5.2,9.5],[3,9.5],[3,14],[0,14]],[[3,3],[6.2,3],[7,4],[7,5.5],[6.2,6.5],[3,6.5]]],
  O: [[[5,0],[10,3],[10,11],[5,14],[0,11],[0,3]],[[5,3.4],[7,4.6],[7,9.4],[5,10.6],[3,9.4],[3,4.6]]],
  A: [[[3.2,0],[6.8,0],[10,14],[7,14],[6.4,11],[3.6,11],[3,14],[0,14]],[[4.2,8.2],[5.8,8.2],[5,4]]],
  D: [[[0,0],[7,0],[10,3],[10,11],[7,14],[0,14]],[[3,3],[6,3],[7,4],[7,10],[6,11],[3,11]]],
  T: [[[0,0],[10,0],[10,3],[6.5,3],[6.5,14],[3.5,14],[3.5,3],[0,3]]],
  L: [[[0,1.5],[1.5,0],[3,0],[3,11],[10,11],[10,12.5],[8.5,14],[0,14]]],
  U: [[[0,0],[3,0],[3,11],[7,11],[7,0],[10,0],[10,12],[8,14],[2,14],[0,12]]],
  N: [[[0,14],[0,0],[3,0],[7,7.5],[7,0],[10,0],[10,14],[7,14],[3,6.5],[3,14]]],
  C: [[[2,0],[10,0],[10,3],[3,3],[3,11],[10,11],[10,14],[2,14],[0,12],[0,2]]],
  H: [[[0,0],[3,0],[3,5.6],[7,5.6],[7,0],[10,0],[10,14],[7,14],[7,8.4],[3,8.4],[3,14],[0,14]]],
  E: [[[0,2],[2,0],[10,0],[10,3],[3,3],[3,5.6],[8.5,5.6],[8.5,8.4],[3,8.4],[3,11],[10,11],[10,14],[0,14]]],
  V: [[[0,0],[3.2,0],[5,9],[6.8,0],[10,0],[6.8,14],[3.2,14]]],
  B: [[[0,0],[7,0],[9.5,2.5],[9.5,5],[8,7],[10,9],[10,11.5],[7.5,14],[0,14]],[[3,3],[6,3],[6.5,3.5],[6.5,5],[6,5.6],[3,5.6]],[[3,8.4],[6.5,8.4],[7,9],[7,10.5],[6.5,11],[3,11]]],
};
function lettering(svg, lines) {
  const s = 6, gap = 1.4, NS = "http://www.w3.org/2000/svg"; let y = 6, maxW = 0, out = "", id = 0;
  for (const [text, cols] of lines) {
    let x = 6, k = 0;
    for (const ch of text) {
      if (ch === " ") { x += 6 * s; continue; }
      const d = G[ch].map(r => "M" + r.map(p => `${(x + p[0] * s).toFixed(1)},${(y + p[1] * s).toFixed(1)}`).join(" L") + "Z").join(" ");
      const base = cols[k++ % cols.length], w = 10 * s, h = 14 * s, cid = "c" + id++;
      out += `<clipPath id="${cid}"><path d="${d}" clip-rule="evenodd"/></clipPath>
        <path d="${d}" transform="translate(0 ${s * .7})" fill="#000" opacity=".55" fill-rule="evenodd" stroke="#000" stroke-width="${s * 1.3}"/>
        <path d="${d}" fill="#15171B" fill-rule="evenodd" stroke="#15171B" stroke-width="${s * 1.3}" stroke-linejoin="miter"/>
        <g clip-path="url(#${cid})"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${base}"/>
        <polygon points="${x},${y} ${x + w},${y} ${x},${y + h * .62}" fill="#fff" opacity=".28"/>
        <polygon points="${x + w},${y + h * .55} ${x + w},${y + h} ${x + w * .35},${y + h}" fill="#000" opacity=".25"/></g>`;
      x += (10 + gap) * s;
    }
    maxW = Math.max(maxW, x); y += 14 * s + 16;
  }
  svg.setAttribute("viewBox", `0 0 ${maxW} ${y}`);
  svg.innerHTML = out;
}


const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
// the short 'what it has' line of each part: the text before 'Next:'
const short = (t) => { const s = t.split(/\.\s*Next:/)[0]; return s.length > 92 ? s.slice(0, s.lastIndexOf(" ", 90)) + "…" : s; };
(async function () {
  const d = await fetch("data.json").then(r => r.json());
  lettering($("title"), [["ROAD TO", ["#1FB5AC", "#3EF2E6"]], ["LAUNCH", ["#FF8A1F", "#F2A51A"]]]);
  const total = d.phases.reduce((a, p) => a + p.months, 0);
  const overall = Math.round(d.phases.reduce((a, p) => a + p.months * p.pct, 0) / total);
  $("overall").firstChild.nodeValue = overall;
  const cur = d.phases.find(p => p.status === "current") || d.phases[0];
  $("now").textContent = `Phase ${cur.id} · ${cur.name}`;
  const N = 40, lit = Math.round(N * overall / 100);
  $("shards").innerHTML = Array.from({length: N}, (_, i) => `<i class="shard ${i < lit ? (i === lit - 1 ? "tip" : "on") : ""}"></i>`).join("");
  $("phases").innerHTML = d.phases.map(p => `<article class="phase ${p.status}"><span class="num">PHASE ${p.id}</span><h3>${esc(p.name)}</h3>
     <span class="chip ${p.status}">${{done: "Done", current: "In progress", next: "Next", later: "Later"}[p.status]}</span>
     <div class="mini"><i style="width:${p.pct}%"></i></div><span class="pct">${p.pct}%</span></article>`).join("");
  $("areas").innerHTML = d.areas.map(a => `<div class="area"><div class="area-head"><h3>${esc(a.name)}</h3><span>${a.pct}%</span></div>
     <div class="bar"><i style="width:${a.pct}%"></i></div><p>${esc(a.short || short(a.detail))}</p></div>`).join("");
  $("next").innerHTML = d.next.slice(0, 6).map(n => `<li><span>${esc(n)}</span></li>`).join("");
  document.body.dataset.ready = "1";
})();
</script></body></html>
